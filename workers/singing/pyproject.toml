[project]
name = "demotif-singing"
version = "0.1.0"
description = "Native PyTorch singing inference worker for Demotif"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.5.1",
  "numpy==1.23.5",
  "scipy==1.10.1",
  "numba==0.57.1",
  "librosa==0.9.2",
  "matplotlib==3.7.5",
  "soundfile==0.12.1",
  "PyYAML==6.0.2",
  "einops==0.6.1",
  "pypinyin==0.49.0",
  "pycwt==0.3.0a22",
  "tqdm==4.67.1",
  "setuptools==75.8.2",
  "six==1.17.0",
  "praat-parselmouth==0.4.5",
  "scikit-image==0.21.0",
  "webrtcvad-wheels==2.0.14",
  "pyloudnorm==0.1.1",
  "g2pm==0.1.2.5",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
